<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="./assets/logo.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | UXXCA</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #000;
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    header img {
      height: 40px;
    }

    nav a {
      color: #f5f5f5;
      margin-left: 2rem;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: #d4af37;
    }

    .contact-section {
      max-width: 1000px;
      margin: 6rem auto;
      padding: 2rem;
      background-color: #151515;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.1);
    }

    .contact-section h1 {
      font-size: 2.5rem;
      text-align: center;
      color: #d4af37;
      margin-bottom: 1rem;
    }

    .contact-section p {
      text-align: center;
      color: #ccc;
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    label {
      font-weight: 500;
      color: #f5f5f5;
    }

    input, textarea {
      padding: 0.9rem;
      background-color: #222;
      border: 1px solid #333;
      color: #f5f5f5;
      border-radius: 8px;
      font-size: 1rem;
      resize: none;
    }

    input:focus, textarea:focus {
      border-color: #d4af37;
      outline: none;
    }

    button {
      background-color: #d4af37;
      color: #000;
      font-weight: 600;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #b8962d;
    }

    .contact-info {
      margin-top: 4rem;
      text-align: center;
      color: #ccc;
    }

    .contact-info h3 {
      color: #d4af37;
      margin-bottom: 0.5rem;
    }

    footer {
      background-color: #000;
      padding: 2rem 3rem;
      text-align: center;
      color: #888;
      border-top: 1px solid #222;
    }

    footer a {
      color: #d4af37;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <img src="assets/logo.png" alt="UXXCA Logo" />
    <nav>
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./pricing.html">Plans</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <section class="contact-section">
    <h1> Finance Smarter Today.</h1>
    <p>Whether you're scaling your business or just getting started, we’d love to hear from you. Drop us a message and our team will get back to you within 24 hours.</p>

    <!-- modify this form HTML and place wherever you want your form -->
<!-- Contact Form -->
<!-- Contact Form -->
<form action="https://formspree.io/f/xdkrjrya" method="POST">

  <label for="name">Name</label>
  <input type="text" id="name" name="name" placeholder="Your name" required />

  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" placeholder="you@business.com" required />

  <!-- Plan Selection -->
  <label for="plan">Select Plan</label>
  <select id="plan" name="plan" required style="padding:0.9rem;background:#222;border:1px solid #333;color:#f5f5f5;border-radius:8px;">
    <option value="" disabled selected>Select your plan</option>
    <option value="Starter">Starter</option>
    <option value="Growth">Growth</option>
    <option value="Pro">Pro</option>
    <option value="Enterprise">Enterprise</option>
  </select>


  <label for="message">Message</label>
  <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>

  <button type="submit">Send Message</button>
</form>

<script>
  const requestBtn = document.getElementById("requestPinBtn");
  const pinField = document.getElementById("pinField");
  const pinInput = document.getElementById("pin");

  requestBtn.addEventListener("click", () => {
    pinField.style.display = "block";
    pinInput.required = true;
    requestBtn.disabled = true;
    requestBtn.innerText = "PIN Requested";
    requestBtn.style.opacity = "0.6";
  });
</script>


  <!-- 🌐 Socials Section -->
  <div class="socials" style="border-top:1px solid rgba(212,175,55,0.2);margin-top:30px;padding:20px 0;text-align:center;">
    <div style="display:flex;justify-content:center;gap:25px;margin-bottom:8px;">
      <a href="https://x.com/UXXCA" target="_blank" class="social-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
          <path d="M18.244 2.25h3.308l-7.227 8.26L22 21.75h-6.593l-5.17-6.772-5.917 6.772H1.01l7.72-8.83L2 2.25h6.75l4.658 6.063L18.244 2.25zM17.094 19.5h1.834L7.05 4.406H5.083L17.094 19.5z"/>
        </svg>
      </a>

      <a href="https://linkedin.com/company/UXXCA" target="_blank" class="social-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
          <path d="M4.98 3.5A2.49 2.49 0 0 0 2.5 5.98c0 1.37 1.13 2.48 2.48 2.48s2.48-1.11 2.48-2.48A2.48 2.48 0 0 0 4.98 3.5zM3 8.89h3.96V21H3V8.89zm7.16 0h3.8v1.64h.05c.53-1 1.84-2.06 3.8-2.06 4.06 0 4.8 2.67 4.8 6.14V21h-3.95v-5.74c0-1.37-.02-3.14-1.91-3.14-1.91 0-2.21 1.49-2.21 3.04V21H10.2V8.89z"/>
        </svg>
      </a>

      <a href="https://instagram.com/UXXCA" target="_blank" class="social-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
          <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2c1.654 0 3 1.346 3 3s-1.346 3-3 3a3 3 0 0 1 0-6zm4.5-3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
        </svg>
      </a>
    </div>
    <p style="font-size:0.85rem;color:#aaa;">Follow us for updates & insights</p>
  </div>

  <div class="footer-bottom">
    © 2025 UXXCA. All rights reserved.
  </div>
</footer>

<!-- 🪶 Styling -->
<style>
  footer {
    background:#0E0E0E;
    color:#ccc;
    padding:50px 8%;
    font-family:'Inter',sans-serif;
  }
  .footer-top {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:40px;
    margin-bottom:30px;
  }
  .footer-top h4 {
    color:#D4AF37;
    font-weight:600;
    margin-bottom:10px;
  }
  .footer-top a {
    display:block;
    color:#aaa;
    font-size:0.9rem;
    text-decoration:none;
    margin:5px 0;
    transition:color 0.3s;
  }
  .footer-top a:hover { color:#D4AF37; }

  .social-link {
    color:#999;
    transition: all 0.3s ease;
  }
  .social-link:hover {
    color:#D4AF37;
    transform: translateY(-2px);
  }

  .footer-bottom {
    text-align:center;
    border-top:1px solid rgba(212,175,55,0.15);
    margin-top:20px;
    padding-top:10px;
    color:#777;
    font-size:0.85rem;
  }
</style>

</body>
</html>
